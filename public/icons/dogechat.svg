<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="dogeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#C68218" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#404EED" />
    </linearGradient>
  </defs>
  <!-- Background Chat Bubble -->
  <rect x="3" y="3" width="42" height="34" rx="10" fill="url(#bubbleGrad)" />
  <polygon points="12,37 18,37 12,43" fill="#404EED" />
  
  <!-- Doge Face Silhouette / Features inside chat bubble -->
  <circle cx="24" cy="20" r="12" fill="url(#dogeGrad)" />
  <!-- Doge ears -->
  <polygon points="14,14 17,8 20,12" fill="#C68218" />
  <polygon points="34,14 31,8 28,12" fill="#C68218" />
  <!-- Doge snout -->
  <ellipse cx="24" cy="23" rx="5" ry="3.8" fill="#F7E2B5" />
  <!-- Nose -->
  <ellipse cx="24" cy="21.5" rx="1.8" ry="1.2" fill="#2C1A09" />
  <!-- Eyes -->
  <circle cx="19.5" cy="18" r="1.6" fill="#2C1A09" />
  <circle cx="20" cy="17.5" r="0.6" fill="#FFFFFF" />
  <circle cx="28.5" cy="18" r="1.6" fill="#2C1A09" />
  <circle cx="29" cy="17.5" r="0.6" fill="#FFFFFF" />
  <!-- Mouth -->
  <path d="M 22.5 24 Q 24 25.2 25.5 24" stroke="#2C1A09" stroke-width="1" stroke-linecap="round" fill="none" />
</svg>
